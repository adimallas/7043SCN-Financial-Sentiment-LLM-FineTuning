name: Task 1 offline evidence checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install pytest nbformat numpy pandas scikit-learn
      - name: Static/scientific checks
        run: python -m pytest tests -q
      - name: Recalculate evidence metrics
        run: python scripts/verify_results.py
